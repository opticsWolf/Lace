[project]
name = "lace-docking"
version = "0.2.5"
description = "Advanced PySide6 docking system"
authors = [
    {name = "opticsWolf", email = "opticswolf@protonmail.com"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "pyside6",
]

# PyPI metadata
readme = "README.md"

# Classifiers for PyPI search
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Qt",
    "Topic :: Desktop Environment :: Qt",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lace"]
include-package-data = true

# Include non-Python assets (SVG icons, etc.)
[tool.setuptools.package-data]
lace = [
    "resources/lace_icons/*.svg",
]
