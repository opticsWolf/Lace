# Separate maturin project so the root `lace-dock` setuptools build stays
# untouched until the Phase 6 cutover. Build with:
#   maturin develop -m rust/lace-py/Cargo.toml   (from repo root, venv active)
[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "lace-rs"
version = "0.1.0"
description = "Thin Python bindings over the Rust lace-core (Phase 0 hello)."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.maturin]
module-name = "_lace_rs"
bindings = "pyo3"
features = ["pyo3/extension-module"]
python-source = "python"
